[package]
name = "media-inference-lab"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "mil"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
png = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
signal-hook = "0.3"
unicode-normalization = "0.1"

[dev-dependencies]
parking_lot = "0.12"
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"

# Full code manifests must also fit the restore deadline in debug builds.
# Keep application debug assertions; optimize only the existing SHA backend.
[profile.dev.package.sha2]
opt-level = 3
