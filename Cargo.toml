[package]
name = "media-inference-lab"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "mil"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
unicode-normalization = "0.1"

[dev-dependencies]
parking_lot = "0.12"
tempfile = "3"
